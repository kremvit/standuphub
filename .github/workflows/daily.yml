name: Daily Update + Deploy Pages

on:
  workflow_dispatch:
  schedule:
    # 06:15 UTC daily (adjust if you want)
    - cron: "15 6 * * *"
  push:
    branches:
      - main
    paths:
      - "performers.txt"
      - "channels.txt"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python scripts/run_pipeline.py

      - name: Save monthly rating snapshot
        run: |
          if git diff --quiet -- docs/data/rating_history.json; then
            echo "Monthly rating snapshot already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/rating_history.json
            git commit -m "Save monthly rating snapshot"
            git push
          fi
      
      # sitemap.xml + robots.txt
      - name: Generate sitemap.xml and robots.txt
        run: |
          python scripts/gen_comedian_pages.py \
            --base https://standuphub.com.ua \
            --docs docs
          cp generated/comedians/*.html docs/
          python -c "import json; from pathlib import Path; pages=json.loads(Path('docs/data/performer_pages.json').read_text(encoding='utf-8')); missing=[slug for slug in pages.values() if not Path('docs', f'{slug}.html').is_file()]; assert not missing, f'Missing generated pages: {missing}'; print(f'Validated {len(pages)} comedian pages')"
          python scripts/gen_sitemap.py \
            --base https://standuphub.com.ua \
            --docs docs

      - name: Upload artifact (Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
