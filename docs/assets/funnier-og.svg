<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0b0f"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
  </g>

  <!-- Top accent bar -->
  <rect width="1200" height="8" fill="#ff8a00"/>

  <!-- Trophy -->
  <text x="600" y="230" font-family="serif" font-size="140" text-anchor="middle">🏆</text>

  <!-- Title -->
  <text x="600" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" fill="#ffffff" text-anchor="middle">Хто смішніший?</text>

  <!-- Subtitle -->
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="34" fill="#a6a6b3" text-anchor="middle">Обирай найсмішнішого коміка у дуелі</text>

  <!-- Divider -->
  <rect x="480" y="430" width="240" height="3" fill="#ff8a00" rx="2"/>

  <!-- Domain -->
  <text x="600" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="30" fill="#ff8a00" text-anchor="middle" font-weight="700">standuphub.com.ua</text>

  <!-- Bottom accent bar -->
  <rect y="622" width="1200" height="8" fill="#ff8a00"/>
</svg>
