<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вгадай панчлайн | StandUpHub</title>

  <style>
    :root {
      --bg: #050505;
      --text: #f5f1ea;
      --muted: #a7a1a0;
      --accent: #e84b32;
      --good: #35c978;
      --bad: #ff4d4d;
      --panel: rgba(10, 10, 10, 0.82);
      --border: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    .game {
      min-height: 100vh;
      position: relative;
      background-image:
        linear-gradient(180deg, rgba(0,0,0,.66) 0%, rgba(0,0,0,.08) 32%, rgba(0,0,0,.34) 62%, rgba(0,0,0,.92) 100%),
        url("assets/openmic-bg.png");
      background-size: cover;
      background-position: center top;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: start;
      padding: 26px clamp(18px, 4vw, 52px) 18px;
      background: linear-gradient(180deg, rgba(0,0,0,.84), rgba(0,0,0,.12));
      text-shadow: 0 2px 12px rgba(0,0,0,.8);
    }

    .topbar small {
      display: block;
      color: var(--muted);
      text-transform: uppercase;
      font-size: clamp(13px, 1.7vw, 20px);
      letter-spacing: .03em;
    }

    .topbar strong {
      display: block;
      margin-top: 5px;
      font-size: clamp(18px, 2.4vw, 30px);
      text-transform: uppercase;
      font-weight: 500;
    }

    .center-hud {
      text-align: center;
      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 600;
      text-transform: uppercase;
    }

    .dots {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: rgba(255,255,255,.28);
    }

    .dot.active { background: white; }

    .streak {
      text-align: right;
    }

    .streak strong {
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 800;
      text-transform: none;
    }

    .question-wrap {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto 28px;
      padding: clamp(22px, 3.2vw, 42px);
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 30px 90px rgba(0,0,0,.72);
      backdrop-filter: blur(16px);
    }

    .label {
      color: var(--accent);
      text-transform: uppercase;
      font-size: 15px;
      letter-spacing: .08em;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .setup {
      margin: 0 0 28px;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.12;
      font-weight: 650;
      letter-spacing: -0.04em;
    }

    .answers {
      display: grid;
      gap: 14px;
    }

    .answer {
      width: 100%;
      min-height: 78px;
      display: grid;
      grid-template-columns: 58px 1fr;
      align-items: center;
      gap: 16px;
      padding: 14px 22px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.055);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      font-size: clamp(18px, 2.1vw, 26px);
      transition: .18s ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: rgba(232, 75, 50, .8);
      background: rgba(255,255,255,.1);
    }

    .answer:disabled {
      cursor: default;
      opacity: .88;
    }

    .letter {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.09);
      font-weight: 700;
    }

    .answer.correct {
      border-color: rgba(53, 201, 120, .9);
      background: rgba(53, 201, 120, .17);
    }

    .answer.wrong {
      border-color: rgba(255, 77, 77, .95);
      background: rgba(255, 77, 77, .16);
    }

    .answer.correct .letter { background: var(--good); color: #06140b; }
    .answer.wrong .letter { background: var(--bad); color: white; }

    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-top: 26px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .sound,
    .next {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.07);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .next {
      min-width: 170px;
      background: rgba(232, 75, 50, .25);
    }

    .reaction {
      flex: 1;
      text-align: center;
      font-size: 16px;
    }

    .start-screen,
    .result-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background-image:
        linear-gradient(180deg, rgba(0,0,0,.62), rgba(0,0,0,.88)),
        url("assets/openmic-bg.png");
      background-size: cover;
      background-position: center;
    }

    .modal {
      width: min(720px, 100%);
      padding: clamp(26px, 5vw, 52px);
      background: rgba(8,8,8,.86);
      border: 1px solid var(--border);
      border-radius: 32px;
      box-shadow: 0 30px 90px rgba(0,0,0,.7);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    h1, h2 {
      margin: 0 0 18px;
      font-size: clamp(44px, 7vw, 82px);
      line-height: .92;
      letter-spacing: -0.07em;
    }

    .modal p {
      color: var(--muted);
      font-size: 20px;
      line-height: 1.5;
      margin: 0 0 24px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.08);
      color: var(--text);
      border-radius: 18px;
      padding: 18px 20px;
      font-size: 20px;
      outline: none;
      margin-bottom: 14px;
    }

    .main-btn {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 18px 20px;
      background: var(--accent);
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }

    .hidden { display: none !important; }

    @media (max-width: 720px) {
      .game {
        background-position: center top;
      }

      .topbar {
        grid-template-columns: 1fr 1fr;
      }

      .center-hud {
        order: 3;
        grid-column: 1 / -1;
      }

      .question-wrap {
        margin-bottom: 14px;
        border-radius: 24px 24px 0 0;
      }

      .answer {
        grid-template-columns: 46px 1fr;
        min-height: 66px;
        padding: 12px 14px;
      }

      .letter {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>
<body>
  <section class="start-screen" id="startScreen">
    <div class="modal">
      <div class="label">StandUpHub game</div>
      <h1>Вгадай панчлайн</h1>
      <p>Ти на перевірці матеріалу. У залі мало людей, їм не дуже цікаво. Треба витягнути виступ правильними панчлайнами.</p>
      <input id="playerName" placeholder="Твоє сценічне імʼя" maxlength="32" />
      <button class="main-btn" id="startBtn">Вийти на сцену</button>
    </div>
  </section>

  <section class="game hidden" id="gameScreen">
    <header class="topbar">
      <div>
        <small id="levelCounter">Рівень 1/3</small>
        <strong id="levelName">Перевірка матеріалу</strong>
      </div>

      <div class="center-hud">
        <div id="jokeCounter">Жарт 1/5</div>
        <div class="dots" id="dots"></div>
      </div>

      <div class="streak">
        <small>Стрік</small>
        <strong id="streak">x0</strong>
      </div>
    </header>

    <div class="question-wrap">
      <div class="label">Сетап</div>
      <h2 class="setup" id="setupText"></h2>

      <div class="answers" id="answers"></div>

      <div class="bottom-row">
        <button class="sound" type="button">🔊 Звук: увімк.</button>
        <div class="reaction" id="reactionText">Публіка поки що дивиться в телефони...</div>
        <button class="next" type="button" id="restartBtn">Спочатку</button>
      </div>
    </div>
  </section>

  <section class="result-screen hidden" id="resultScreen">
    <div class="modal">
      <div class="label">Результат</div>
      <h2 id="resultTitle">Виступ завершено</h2>
      <p id="resultText"></p>
      <button class="main-btn" id="playAgainBtn">Зіграти ще раз</button>
    </div>
  </section>

  <script>
    const LEVEL = {
      name: "Перевірка матеріалу",
      total: 5
    };

    const JOKES = [
      {
        setup: "Я зрозумів, що дорослішання — це коли...",
        options: [
          "ти починаєш радіти знижкам у магазині",
          "ти боїшся не монстрів під ліжком, а рахунків",
          "ти мрієш не про відпустку, а про нормальний сон",
          "ти більше не можеш їсти все підряд"
        ],
        correct: 2
      },
      {
        setup: "На перевірці матеріалу найстрашніше не тиша в залі, а коли...",
        options: [
          "офіціант сміється голосніше за публіку",
          "після панча людина просто затягується кальяном",
          "хтось каже: це вже було в TikTok",
          "ти сам розумієш жарт тільки дорогою додому"
        ],
        correct: 1
      },
      {
        setup: "Я люблю людей, які кажуть: “будь собою”. Бо зазвичай вони...",
        options: [
          "не готові до наслідків",
          "мають на увазі кращу версію мене",
          "кажуть це перед тим, як піти",
          "не бачили мене в понеділок"
        ],
        correct: 0
      },
      {
        setup: "У дорослому житті найбільша інтрига — це не любов і не карʼєра, а...",
        options: [
          "що це за платіж у банку",
          "де лежить зарядка",
          "чому знову болить спина",
          "чи висохне одяг до ранку"
        ],
        correct: 0
      },
      {
        setup: "Коли людина пише “можна питання?”, я вже напружуюсь, бо це ніколи не питання, це...",
        options: [
          "початок переговорів без бюджету",
          "борг у красивій упаковці",
          "тривожний трейлер",
          "квест без можливості відмовитись"
        ],
        correct: 2
      }
    ];

    const $ = id => document.getElementById(id);

    let player = "Комік";
    let index = 0;
    let streak = 0;
    let locked = false;

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    function startGame() {
      player = $("playerName").value.trim() || "Комік";
      index = 0;
      streak = 0;
      $("startScreen").classList.add("hidden");
      $("resultScreen").classList.add("hidden");
      $("gameScreen").classList.remove("hidden");
      renderQuestion();
    }

    function renderDots() {
      $("dots").innerHTML = "";
      for (let i = 0; i < LEVEL.total; i++) {
        const dot = document.createElement("span");
        dot.className = "dot" + (i === index ? " active" : "");
        $("dots").appendChild(dot);
      }
    }

    function renderQuestion() {
      locked = false;
      const joke = JOKES[index];
      $("levelCounter").textContent = "Рівень 1/3";
      $("levelName").textContent = LEVEL.name;
      $("jokeCounter").textContent = `Жарт ${index + 1}/${LEVEL.total}`;
      $("streak").textContent = `x${streak}`;
      $("setupText").textContent = joke.setup;
      $("reactionText").textContent = "Публіка поки що дивиться в телефони...";
      renderDots();

      const answers = joke.options.map((text, i) => ({ text, correct: i === joke.correct }));
      const mixed = shuffle(answers);
      const letters = ["A", "B", "C", "D"];
      $("answers").innerHTML = "";

      mixed.forEach((answer, i) => {
        const btn = document.createElement("button");
        btn.className = "answer";
        btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${answer.text}</span>`;
        btn.onclick = () => chooseAnswer(answer, btn);
        $("answers").appendChild(btn);
      });
    }

    function chooseAnswer(answer, btn) {
      if (locked) return;
      locked = true;
      document.querySelectorAll(".answer").forEach(b => b.disabled = true);

      if (answer.correct) {
        btn.classList.add("correct");
        streak++;
        $("streak").textContent = `x${streak}`;
        $("reactionText").textContent = getGoodReaction();
        setTimeout(nextQuestion, 900);
      } else {
        btn.classList.add("wrong");
        streak = 0;
        $("streak").textContent = "x0";
        $("reactionText").textContent = getBadReaction();
        setTimeout(() => finish(false), 1100);
      }
    }

    function nextQuestion() {
      index++;
      if (index >= LEVEL.total) {
        finish(true);
      } else {
        renderQuestion();
      }
    }

    function finish(won) {
      $("gameScreen").classList.add("hidden");
      $("resultScreen").classList.remove("hidden");

      if (won) {
        $("resultTitle").textContent = "Ти витягнув перевірку";
        $("resultText").textContent = `${player}, ти вгадав усі 5 панчлайнів. Навіть люди з кальянами почали слухати.`;
      } else {
        $("resultTitle").textContent = "Панч не зайшов";
        $("resultText").textContent = `${player}, ти вилетів на перевірці матеріалу. Публіка повернулась до телефонів.`;
      }
    }

    function getGoodReaction() {
      const list = [
        "Один хлопець біля кальяну навіть посміхнувся.",
        "Є перший смішок. Це вже майже овації для перевірки.",
        "Дівчина з телефоном підняла очі. Перемога.",
        "Зал трохи ожив. Продовжуй.",
        "Бармен кивнув. Це найчесніший сміх вечора."
      ];
      return list[Math.floor(Math.random() * list.length)];
    }

    function getBadReaction() {
      const list = [
        "Тиша. Чути тільки булькання кальяну.",
        "Хтось перевірив, чи не сіла батарея на телефоні.",
        "Панч пролетів повз зал і вийшов через службовий вихід.",
        "Одна людина подивилась на тебе з повагою. Але це був офіціант.",
        "Зал вирішив, що це була пауза для диму."
      ];
      return list[Math.floor(Math.random() * list.length)];
    }

    $("startBtn").onclick = startGame;
    $("restartBtn").onclick = startGame;
    $("playAgainBtn").onclick = startGame;
    $("playerName").addEventListener("keydown", e => {
      if (e.key === "Enter") startGame();
    });
  </script>
</body>
</html>
