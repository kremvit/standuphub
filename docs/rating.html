<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon-180.png" />
  <title>Рейтинг • StandupHub</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-J8G4SLH1YT"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-J8G4SLH1YT');

<body>
  <div class="layout">
    <main class="main">
      <header class="topbar">
        <!-- BRAND BLOCK (зліва) -->
        <div class="topBrand">
          <a class="brandLink" href="./index.html">
            <span class="brandA">Stand Up</span><span class="brandB">Hub</span>
          </a>
          <div class="slogan">Твоя щоденна доза стендапу</div>
        </div>

        <div class="navLeft">
          <a class="navBtn" href="./index.html">Відео</a>
          <a class="navBtn active" href="./rating.html">Рейтинг</a>
          <a class="navBtn" href="./comedians.html">Коміки</a>
          <a class="navBtn" href="./about.html">Про сайт</a>
          <a class="navBtn" href="./statistics.html">Статистика</a>
          <a class="navBtn" href="./funnier.html">Хто смішніший?</a>
          <a class="navBtn" href="./game.html">Кар'єра</a>
          <a class="navBtn" href="./network.html">Мережа</a>
        </div>

        <div class="controls">
          <div class="control search">
            <label>Пошук коміка</label>
            <input id="ratingSearch" placeholder="введи імʼя…" />
          </div>
          <div class="control select">
            <label>Рік рейтингу</label>
            <select id="ratingYear" aria-label="Вибір року рейтингу">
              <option value="all">Усі роки</option>
              <option value="2022">2022</option>
              <option value="2023">2023</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
              <option value="2026">2026</option>
            </select>
          </div>
        </div>
      </header>

      <section>
        <table id="ratingTable" class="ratingTable"></table>
      </section>
    </main>

    <aside class="sidebar">
      <div class="sidebarSection">
        <div class="sidebarTitle">Топ коміків</div>
        <div id="sidebarTop" class="sidebarList"></div>
        <a class="sideAllBtn" href="./comedians.html">Усі коміки →</a>
      </div>
    </aside>
  </div>

  <script src="assets/app.js"></script>
  <script>
    StandupHub.initRating();
  </script>
</body>
</html>
