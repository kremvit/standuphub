<body>
  <div class="layout">
    <main class="main">
      <header class="topbar">
        <!-- BRAND BLOCK (зліва) -->
        <div class="topBrand">
          <a class="brandLink" href="./index.html">
            <span class="brandA">Stand Up</span><span class="brandB">Hub</span>
          </a>
          <div class="slogan">
            Твоя щоденна доза стендапу
          </div>
        </div>

        <!-- NAV -->
        <div class="navLeft">
          <a class="navBtn" href="./index.html">Відео</a>
          <a class="navBtn" href="./rating.html">Рейтинг</a>
          <a class="navBtn" href="./afisha.html">Афіша</a>
          <a class="navBtn" href="./funnier.html">Хто смішніший?</a>
          <details class="navMore">
            <summary class="navBtn">Ще⌄</summary>
            <div class="navMoreMenu">
              <a class="navBtn" href="./comedians.html">Коміки</a>
              <a class="navBtn" href="./about.html">Про сайт</a>
              <a class="navBtn" href="./statistics.html">Статистика</a>
              <a class="navBtn" href="./game.html">Кар'єра</a>
              <a class="navBtn" href="./network.html">Мережа</a>
            </div>
          </details>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
          <div class="control">
            <label>Сортування</label>
            <select id="sortSelect">
              <option value="date_desc">Останні додані</option>
              <option value="views_desc">Найбільше переглядів</option>
            </select>
          </div>

          <div class="control">
            <label>Найкраще</label>
            <select id="rangeSelect">
              <option value="all">Увесь час</option>
              <option value="1m">За місяць</option>
              <option value="6m">За пів року</option>
              <option value="1y">За рік</option>
            </select>
          </div>

          <div class="control search">
            <label>Пошук</label>
            <input id="searchInput" list="performerSuggestions" placeholder="назва відео / комік" />
            <datalist id="performerSuggestions"></datalist>
          </div>
        </div>
      </header>

      <section>
        <div id="grid" class="grid"></div>
        <div id="pagination" class="pagination"></div>
        <div id="homeRows" class="homeRows"></div>
      </section>
    </main>

    <aside class="sidebar">
      <div class="sidebarSection">
        <div class="sidebarTitle">Топ коміків</div>
        <div id="sidebarTop" class="sidebarList"></div>
        <a class="sideAllBtn" href="./comedians.html">Усі коміки →</a>
      </div>

      <!-- ✅ SEO-блок перенесено в низ сайдбару (на мобільному буде під “Топ коміків”) -->
      <div class="sidebarSection">
        <div class="sidebarTitle">Український стендап</div>
        <div class="sidebarList">
          <div class="sidebarItem">
            Що таке український стендап, як ми збираємо відео, коміків та формуємо рейтинг — коротко і по суті на окремій сторінці.
          </div>
        </div>
        <a class="sideAllBtn" href="./ukrainskyi-standup.html">Докладніше →</a>
      </div>
    </aside>
  </div>

  <script src="assets/app.js"></script>
  <script>
    StandupHub.init({ mode: "all", performer: null });
  </script>
