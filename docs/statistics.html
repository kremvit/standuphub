<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Статистика — StandupHub</title>

  <!-- Підключи ваші існуючі стилі -->
  <link rel="stylesheet" href="assets/styles.css" />

  <style>
    /* Локальні стилі лише для цієї сторінки (не чіпають інші) */
    .stats-wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .stats-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .stats-title { margin: 0; }
    .stats-controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .stats-controls label { opacity: .85; font-size: 14px; }
    .stats-controls input[type="month"] { padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.15); color: inherit; }

    .stats-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px; margin-top:14px; }
    @media (max-width: 900px){ .stats-grid{ grid-template-columns: 1fr; } }

    .stat-card { padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.12); }
    .stat-label { opacity: .78; font-size: 13px; margin-bottom: 6px; }
    .stat-value { font-size: 28px; font-weight: 700; line-height: 1.15; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
    .stat-delta { font-size: 14px; font-weight: 600; opacity: .85; }
    .delta-pos { }
    .delta-neg { opacity: .85; }
    .delta-zero { opacity: .6; }

    .top-box { margin-top: 14px; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.12); }
    .top-head { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline; }
    .top-title { margin: 0; }
    .top-meta { opacity: .8; font-size: 14px; }
    .yt-wrap { margin-top: 12px; border-radius: 14px; overflow:hidden; border: 1px solid rgba(255,255,255,.10); background: rgba(0,0,0,.20); }
    .yt-wrap iframe { width:100%; aspect-ratio: 16 / 9; border:0; display:block; }

    .hint { margin-top: 10px; opacity: .7; font-size: 13px; }
    .error { margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,120,120,.35); background: rgba(255,120,120,.10); }
  </style>
</head>

<body>
  <!-- Якщо у вас на інших сторінках є header/nav — скопіюй його сюди 1:1
       і лише додай/перевір лінк "Статистика". -->
  <!-- ===== HEADER START (приклад — заміни на ваш реальний хедер) ===== -->
  <header>
    <div class="stats-wrap">
      <nav class="stats-nav">
        <a href="index.html">Головна</a>
        <a href="comedians.html">Коміки</a>
        <a href="rating.html">Рейтинг</a>
        <a href="statistics.html">Статистика</a>
      </nav>
    </div>
  </header>
  <!-- ===== HEADER END ===== -->

  <main class="stats-wrap">
    <div class="stats-head">
      <h1 class="stats-title">Статистика по місяцях</h1>

      <div class="stats-controls">
        <label for="monthPick">Місяць:</label>
        <input id="monthPick" type="month" />
      </div>
    </div>

    <div class="stats-grid" id="statsGrid" aria-live="polite"></div>

    <section class="top-box" id="topBox" hidden>
      <div class="top-head">
        <h2 class="top-title">Топ відео місяця</h2>
        <div class="top-meta" id="topMeta"></div>
      </div>
      <div class="yt-wrap" id="ytWrap"></div>
    </section>

    <div class="hint" id="hint">Завантажую дані…</div>
    <div class="error" id="error" hidden></div>
  </main>

  <script>
    // ---------- tolerant getters ----------
    function getPublishedRaw(v){
      return (
        v?.published_at ??
        v?.publishedAt ??
        v?.published ??
        v?.published_date ??
        v?.date ??
        v?.snippet?.publishedAt ??
        ""
      );
    }
    function getVideoId(v){
      return (v?.video_id ?? v?.videoId ?? v?.id ?? v?.contentDetails?.videoId ?? "");
    }
    function getViews(v){
      const x = (v?.view_count ?? v?.viewCount ?? v?.views ?? v?.statistics?.viewCount ?? 0);
      const n = Number(String(x).replace(/\s+/g,"").replace(/,/g,""));
      return Number.isFinite(n) ? n : 0;
    }
    function getDurationSec(v){
      const x = (v?.duration_sec ?? v?.durationSec ?? v?.duration_seconds ?? v?.duration ?? 0);
      const n = Number(String(x).replace(/\s+/g,"").replace(/,/g,""));
      return Number.isFinite(n) ? n : 0;
    }
    function getTitle(v){
      return (v?.title ?? v?.snippet?.title ?? "");
    }

    // ---------- helpers ----------
    function pad2(n){ return String(n).padStart(2,"0"); }
    function monthKeyFromDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; } // YYYY-MM
    function parseDateSafe(s){
      const d = new Date(s);
      return Number.isNaN(d.getTime()) ? null : d;
    }
    function fmtNum(n){
      try { return new Intl.NumberFormat("uk-UA").format(n); }
      catch { return String(n); }
    }
    function fmtDelta(n){
      if (!Number.isFinite(n) || n === 0) return { text: "0", cls: "delta-zero" };
      const sign = n > 0 ? "+" : "?";
      return { text: `${sign}${fmtNum(Math.abs(n))}`, cls: n > 0 ? "delta-pos" : "delta-neg" };
    }
    function fmtMinutes(totalSec){
      const mins = Math.round((totalSec/60) * 10) / 10; // 0.1 точність
      // показуємо без .0 коли ціле
      const isInt = Math.abs(mins - Math.round(mins)) < 1e-9;
      return isInt ? fmtNum(Math.round(mins)) : String(mins).replace(".", ",");
    }

    async function fetchText(url){
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(`HTTP ${r.status} для ${url}`);
      return await r.text();
    }

    function parseCSV(text){
      // Мінімальний CSV-парсер з підтримкою лапок
      const rows = [];
      let i = 0, field = "", row = [], inQuotes = false;
      while (i < text.length){
        const c = text[i];
        if (inQuotes){
          if (c === '"'){
            if (text[i+1] === '"'){ field += '"'; i += 2; continue; }
            inQuotes = false; i++; continue;
          }
          field += c; i++; continue;
        } else {
          if (c === '"'){ inQuotes = true; i++; continue; }
          if (c === ','){ row.push(field); field=""; i++; continue; }
          if (c === '\n' || c === '\r'){
            // завершити рядок
            // пропускаємо \r\n
            if (c === '\r' && text[i+1] === '\n') i++;
            row.push(field); field="";
            if (row.some(x => x !== "")) rows.push(row);
            row = [];
            i++; continue;
          }
          field += c; i++; continue;
        }
      }
      // last
      row.push(field);
      if (row.some(x => x !== "")) rows.push(row);

      if (!rows.length) return [];
      const header = rows[0].map(h => String(h).trim());
      const out = [];
      for (let r = 1; r < rows.length; r++){
        const obj = {};
        for (let c = 0; c < header.length; c++){
          obj[header[c]] = rows[r][c] ?? "";
        }
        out.push(obj);
      }
      return out;
    }

    async function loadVideosAny(){
      // Спробуємо кілька варіантів шляхів, щоб не “прив’язуватись” до одного формату.
      const candidates = [
        "data/videos.json",
        "data/videos_clean.json",
        "data/videos_clean.csv",
        "data/videos.csv",
        "videos_clean.csv"
      ];

      let lastErr = null;
      for (const url of candidates){
        try {
          const txt = await fetchText(url);
          // пробуємо JSON
          if (txt.trim().startsWith("{") || txt.trim().startsWith("[")){
            const j = JSON.parse(txt);
            if (Array.isArray(j)) return j;
            if (Array.isArray(j?.videos)) return j.videos;
            if (Array.isArray(j?.items)) return j.items;
            // fallback: спроба “витягти” будь-який масив
            for (const k of Object.keys(j||{})){
              if (Array.isArray(j[k])) return j[k];
            }
            throw new Error(`JSON у ${url} не містить масиву відео`);
          }
          // інакше CSV
          return parseCSV(txt);
        } catch (e){
          lastErr = e;
        }
      }
      throw lastErr || new Error("Не вдалося завантажити дані відео");
    }

    function buildMonthlyIndex(videos){
      const byMonth = new Map();

      for (const v of videos){
        const d = parseDateSafe(getPublishedRaw(v));
        if (!d) continue;

        const key = monthKeyFromDate(d);
        if (!byMonth.has(key)){
          byMonth.set(key, { key, videos: [], views: 0, durationSec: 0 });
        }
        const m = byMonth.get(key);
        m.videos.push(v);
        m.views += getViews(v);
        m.durationSec += getDurationSec(v);
      }

      // Список місяців з 2004-03 і до поточного, навіть якщо 0 відео
      const START = new Date(2004, 2, 1); // March 2004 (місяці 0-індекс)
      const now = new Date();
      const months = [];
      let cur = new Date(START.getFullYear(), START.getMonth(), 1);
      while (cur <= now){
        const key = monthKeyFromDate(cur);
        const rec = byMonth.get(key) || { key, videos: [], views: 0, durationSec: 0 };
        months.push(rec);
        cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
      }

      return months;
    }

    function pickDefaultMonth(months){
      // останній місяць, де є хоч якісь відео; якщо немає — поточний
      for (let i = months.length - 1; i >= 0; i--){
        if ((months[i].videos?.length || 0) > 0) return months[i].key;
      }
      const now = new Date();
      return monthKeyFromDate(now);
    }

    function getTopVideoByViews(videos){
      let best = null;
      let bestViews = -1;
      for (const v of videos){
        const vv = getViews(v);
        if (vv > bestViews){
          bestViews = vv;
          best = v;
        }
      }
      return best;
    }

    function renderStats(selected, prev){
      const grid = document.getElementById("statsGrid");
      grid.innerHTML = "";

      const count = selected.videos.length;
      const prevCount = prev ? prev.videos.length : 0;

      const views = selected.views;
      const prevViews = prev ? prev.views : 0;

      const durSec = selected.durationSec;
      const prevDurSec = prev ? prev.durationSec : 0;

      const dCount = fmtDelta(count - prevCount);
      const dViews = fmtDelta(views - prevViews);
      const dMins = fmtDelta(Math.round(durSec/60) - Math.round(prevDurSec/60));

      const cards = [
        {
          label: "Відео за місяць",
          value: fmtNum(count),
          delta: dCount
        },
        {
          label: "Перегляди за місяць",
          value: fmtNum(views),
          delta: dViews
        },
        {
          label: "Хвилини контенту",
          value: fmtMinutes(durSec),
          delta: dMins
        }
      ];

      for (const c of cards){
        const el = document.createElement("div");
        el.className = "stat-card";
        el.innerHTML = `
          <div class="stat-label">${c.label}</div>
          <div class="stat-value">
            <span>${c.value}</span>
            <span class="stat-delta ${c.delta.cls}">(${c.delta.text})</span>
          </div>
        `;
        grid.appendChild(el);
      }

      // top video
      const topBox = document.getElementById("topBox");
      const ytWrap = document.getElementById("ytWrap");
      const topMeta = document.getElementById("topMeta");

      ytWrap.innerHTML = "";
      topMeta.textContent = "";

      const top = getTopVideoByViews(selected.videos);
      const vid = top ? getVideoId(top) : "";
      if (vid){
        topBox.hidden = false;
        const title = getTitle(top);
        const vws = getViews(top);
        topMeta.textContent = `${fmtNum(vws)} переглядів · ${title ? title : " "}`.trim();

        const iframe = document.createElement("iframe");
        iframe.setAttribute("allowfullscreen", "true");
        iframe.setAttribute("loading", "lazy");
        iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
        iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(vid)}`;
        ytWrap.appendChild(iframe);
      } else {
        topBox.hidden = true;
      }
    }

    (async function main(){
      const hint = document.getElementById("hint");
      const error = document.getElementById("error");
      const monthPick = document.getElementById("monthPick");

      try {
        const videos = await loadVideosAny();
        const months = buildMonthlyIndex(videos);

        const defaultKey = pickDefaultMonth(months);
        monthPick.min = "2004-03";
        monthPick.max = monthKeyFromDate(new Date());
        monthPick.value = defaultKey;

        function update(){
          const key = monthPick.value;
          const idx = months.findIndex(m => m.key === key);
          const selected = idx >= 0 ? months[idx] : { key, videos: [], views: 0, durationSec: 0 };
          const prev = idx > 0 ? months[idx-1] : null;
          renderStats(selected, prev);
          hint.textContent = "";
        }

        monthPick.addEventListener("change", update);
        update();

      } catch (e){
        error.hidden = false;
        error.textContent = "Не вдалося завантажити статистику. " + (e?.message || e);
        hint.textContent = "";
      }
    })();
  </script>
</body>
</html>
