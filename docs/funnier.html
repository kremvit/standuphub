  <style>
    .gameSection {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 40px 0;
    }

    .gameHeader {
      text-align: center;
    }

    .gameTitle {
      font-size: 28px;
      font-weight: 900;
      margin: 0 0 8px;
    }

    .gameSubtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    .roundBar {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .roundDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s;
    }

    .roundDot.done {
      background: var(--accent);
    }

    .roundDot.active {
      background: rgba(255, 138, 0, 0.4);
      box-shadow: 0 0 0 2px rgba(255, 138, 0, 0.3);
    }

    .arena {
      display: flex;
      align-items: stretch;
      gap: 20px;
      width: 100%;
      max-width: 680px;
    }

    .fighterCard {
      flex: 1;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      cursor: pointer;
      text-align: center;
      font-weight: 900;
      font-size: 22px;
      line-height: 1.3;
      transition: border-color 0.2s, transform 0.12s, box-shadow 0.2s, opacity 0.25s;
      user-select: none;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 400px;
      overflow: hidden;
    }

    .fighterPhoto {
      width: 100%;
      height: auto;
      max-height: 320px;
      border-radius: 16px;
      object-fit: cover;
      object-position: center;
      background: linear-gradient(135deg,#1f1f2b,#10101a);
      flex-shrink: 0;
      aspect-ratio: 1;
    }

    .fighterName {
      font-size: 16px;
      font-weight: 900;
      padding: 8px;
      word-break: break-word;
      margin-top: auto;
    }

    .fighterCard:hover {
      border-color: rgba(255, 138, 0, 0.75);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(255, 138, 0, 0.15);
    }

    .fighterCard:active {
      transform: scale(0.96);
    }

    .fighterCard.losing {
      animation: fadeOut 0.35s ease forwards;
    }

    .fighterCard.winning {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 138, 0, 0.2);
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: scale(0.85); }
    }

    .vsLabel {
      font-size: 22px;
      font-weight: 900;
      color: var(--muted);
      align-self: center;
      flex-shrink: 0;
    }

    /* Winner screen */
    .winnerScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
      padding: 40px 0;
    }

    .winnerScreen.visible {
      display: flex;
    }

    .gameSection.hidden {
      display: none;
    }

    .trophyIcon {
      font-size: 64px;
      line-height: 1;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popIn {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .winnerLabel {
      color: var(--muted);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .winnerName {
      font-size: 36px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1.2;
    }

    .winnerStats {
      color: var(--muted);
      font-size: 15px;
      min-height: 22px;
    }
    .winnerStats b { color: var(--text); font-weight: 900; }

    .winnerTopWrap {
      width: min(420px, 100%);
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
    }

    .winnerTopTitle {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .winnerTopList {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .winnerTopItem {
      display: grid;
      grid-template-columns: 26px 1fr auto;
      gap: 10px;
      align-items: center;
      font-size: 14px;
    }

    .winnerTopRank {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 138, 0, 0.1);
      color: var(--accent);
      font-weight: 900;
      font-size: 12px;
    }

    .winnerTopWins {
      color: var(--accent);
      font-weight: 900;
      font-size: 13px;
    }

    .winnerTopEmpty {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 8px 0;
    }

    .winnerActions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .actionBtn {
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .actionBtn:hover {
      border-color: rgba(255, 138, 0, 0.75);
    }

    .actionBtn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #111;
    }

    .actionBtn.primary:hover {
      opacity: 0.88;
    }

    .copyToast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #222;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 999;
    }
    .copyToast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

  <script src="assets/app.js"></script>
  <script>
    StandupHub.initAbout();

    const TOTAL_ROUNDS = 10;

    // ---- Firebase win counter ----
    // Replace with your Firebase Realtime Database URL
    const FIREBASE_DB = "https://standuphubwinner-default-rtdb.europe-west1.firebasedatabase.app";
    const FB_PATH = "funnier_wins";
    const FB_ROOT = `${FIREBASE_DB}/${FB_PATH}`;

    function fbKey(name) {
      return encodeURIComponent(name.replace(/[.#$[\]/]/g, "_"));
    }

    async function recordWin(name) {
      if (!FIREBASE_DB || FIREBASE_DB === "YOUR_FIREBASE_URL") return;
      try {
        await fetch(`${FB_ROOT}/${fbKey(name)}.json`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ wins: { ".sv": { "increment": 1 } } })
        });
      } catch {}
    }

    async function displayWins(name) {
      const el = document.getElementById("winnerStats");
      if (!el) return;
      if (!FIREBASE_DB || FIREBASE_DB === "YOUR_FIREBASE_URL") return;
      try {
        const r = await fetch(`${FB_ROOT}/${fbKey(name)}.json`);
        if (!r.ok) {
          if (r.status === 401) {
            el.textContent = "Статистика перемог недоступна";
          }
          return;
        }
        const data = await r.json();
        const wins = data?.wins ?? 0;
        el.innerHTML = `Перемагав <b>${wins}</b> ${wins === 1 ? "раз" : "разів"} серед усіх гравців`;
      } catch {}
    }

    function decodeFbKey(key) {
      try {
        return decodeURIComponent(key);
      } catch {
        return key;
      }
    }

    async function loadTopWinners() {
      const el = document.getElementById("winnerTopList");
      if (!el) return;
      if (!FIREBASE_DB || FIREBASE_DB === "YOUR_FIREBASE_URL") {
        el.innerHTML = '<li class="winnerTopEmpty">Топ-10 недоступний</li>';
        return;
      }

      try {
        const r = await fetch(`${FB_ROOT}.json`);
        if (!r.ok) {
          if (r.status === 401) {
            el.innerHTML = '<li class="winnerTopEmpty">Топ-10 недоступний (Firebase rules)</li>';
          } else {
            el.innerHTML = '<li class="winnerTopEmpty">Не вдалося завантажити топ-10</li>';
          }
          return;
        }
        const data = await r.json();
        const entries = Object.entries(data || {})
          .map(([key, value]) => ({
            name: decodeFbKey(key),
            wins: Number(value?.wins ?? 0) || 0
          }))
          .filter(item => item.name && item.wins > 0)
          .sort((a, b) => b.wins - a.wins || a.name.localeCompare(b.name));

        el.innerHTML = "";
        if (!entries.length) {
          el.innerHTML = '<li class="winnerTopEmpty">Поки що немає даних</li>';
          return;
        }

        entries.slice(0, 10).forEach((item, index) => {
          const li = document.createElement("li");
          li.className = "winnerTopItem";
          li.innerHTML = `
            <span class="winnerTopRank">${index + 1}</span>
            <span>${item.name}</span>
            <span class="winnerTopWins">${item.wins}</span>
          `;
          el.appendChild(li);
        });
      } catch {
        el.innerHTML = '<li class="winnerTopEmpty">Не вдалося завантажити топ-10</li>';
      }
    }

    let deck = [];
    let champion = "";
    let challenger = "";
    let turn = 0;        // rounds completed
    let busy = false;
    let performersData = {};
    const photoCache = {};  // Cache photo URLs to avoid repeated requests

    const gameSection  = document.getElementById("gameSection");
    const winnerScreen = document.getElementById("winnerScreen");
    const roundBar     = document.getElementById("roundBar");
    const cardA        = document.getElementById("cardA");
    const cardB        = document.getElementById("cardB");
    const winnerName   = document.getElementById("winnerName");
    const shareBtn     = document.getElementById("shareBtn");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const copyToast    = document.getElementById("copyToast");

    function generateSilhouette() {
      const silhouette = `
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#1f1f2b;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#0d0d14;stop-opacity:1" />
            </linearGradient>
          </defs>
          <rect width="200" height="200" fill="url(#grad)"/>
          <circle cx="100" cy="60" r="35" fill="#666"/>
          <path d="M 50 120 Q 50 100 100 100 Q 150 100 150 120 L 150 180 Q 150 200 130 200 L 70 200 Q 50 200 50 180 Z" fill="#888"/>
        </svg>
      `;
      return "data:image/svg+xml," + encodeURIComponent(silhouette);
    }

    async function getPerformerPhotoUrl(performer) {
      // Check cache first
      if (performer in photoCache) {
        return photoCache[performer];
      }

      // Try jpg first, then png
      for (const format of [".jpg", ".png"]) {
        const path = `./photo/${encodeURIComponent(performer)}${format}`;
        try {
          const r = await fetch(path, { method: "HEAD", cache: "no-cache" });
          if (r.ok) {
            photoCache[performer] = path;
            return path;
          }
        } catch {}
      }
      
      // Cache the silhouette as well to avoid rechecking
      const silhouette = generateSilhouette();
      photoCache[performer] = silhouette;
      return silhouette;
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildRoundBar() {
      roundBar.innerHTML = "";
      for (let i = 0; i < TOTAL_ROUNDS; i++) {
        const dot = document.createElement("div");
        dot.className = "roundDot" + (i < turn ? " done" : i === turn ? " active" : "");
        roundBar.appendChild(dot);
      }
    }

    function startGame(names) {
      deck = shuffle(names);
      turn = 0;

      // Need at least 2 comedians
      if (deck.length < 2) return;

      champion  = deck.shift();
      challenger = deck.shift();

      gameSection.classList.remove("hidden");
      winnerScreen.classList.remove("visible");

      renderRound();
    }

    function renderRound() {
      buildRoundBar();
      
      // Lazy load photos only when needed
      Promise.all([
        getPerformerPhotoUrl(champion),
        getPerformerPhotoUrl(challenger)
      ]).then(([photoA, photoB]) => {
        cardA.innerHTML = `
          <img src="${photoA}" alt="${champion}" class="fighterPhoto" />
          <div class="fighterName">${champion}</div>
        `;
        cardB.innerHTML = `
          <img src="${photoB}" alt="${challenger}" class="fighterPhoto" />
          <div class="fighterName">${challenger}</div>
        `;
        cardA.className = "fighterCard";
        cardB.className = "fighterCard";
      });
      
      busy = false;
    }

    function pick(winner, loserCard) {
      if (busy) return;
      busy = true;

      loserCard.classList.add("losing");

      setTimeout(() => {
        turn++;

        if (turn >= TOTAL_ROUNDS) {
          showWinner(winner);
          return;
        }

        // Refill deck if empty (cycle)
        if (deck.length === 0) {
          const allNames = [...document.querySelectorAll(".sideItem .sideName")]
            .map(el => el.textContent.trim())
            .filter(n => n && n !== winner);
          deck = shuffle(allNames.length > 0 ? allNames : [winner + " (bis)"]);
        }

        champion  = winner;
        challenger = deck.shift();

        renderRound();
      }, 380);
    }

    function showWinner(name, fromLink) {
      winnerName.innerHTML = `<a href="./comedian.html?p=${encodeURIComponent(name)}" style="color:inherit;text-decoration:none;border-bottom:3px solid var(--accent);padding-bottom:2px;">${name}</a>`;
      gameSection.classList.add("hidden");
      winnerScreen.classList.add("visible");
      history.replaceState({}, "", `?winner=${encodeURIComponent(name)}`);
      document.getElementById("winnerStats").textContent = "";
      if (!fromLink) recordWin(name);
      Promise.all([
        displayWins(name),
        loadTopWinners()
      ]);
    }

    function showToast(msg) {
      copyToast.textContent = msg;
      copyToast.classList.add("show");
      setTimeout(() => copyToast.classList.remove("show"), 2200);
    }

    cardA.addEventListener("click", () => pick(champion,   cardB));
    cardB.addEventListener("click", () => pick(challenger, cardA));

    cardA.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(champion, cardB); } });
    cardB.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(challenger, cardA); } });

    function buildShareImage(name) {
      const W = 1080, H = 1080;
      const canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext("2d");

      // Background
      ctx.fillStyle = "#0b0b0f";
      ctx.fillRect(0, 0, W, H);

      // Accent border strip at top
      ctx.fillStyle = "#ff8a00";
      ctx.fillRect(0, 0, W, 10);

      // Subtle grid lines
      ctx.strokeStyle = "rgba(255,255,255,0.04)";
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y < H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

      // Trophy
      ctx.font = "160px serif";
      ctx.textAlign = "center";
      ctx.fillText("🏆", W / 2, 340);

      // Label
      ctx.fillStyle = "#a6a6b3";
      ctx.font = "bold 36px system-ui, sans-serif";
      ctx.letterSpacing = "6px";
      ctx.fillText("ХТО СМІШНІШИЙ?", W / 2, 430);
      ctx.letterSpacing = "0px";

      // Winner name — scale to fit
      ctx.fillStyle = "#ff8a00";
      let fontSize = 100;
      ctx.font = `900 ${fontSize}px system-ui, sans-serif`;
      while (ctx.measureText(name).width > W - 120 && fontSize > 40) {
        fontSize -= 4;
        ctx.font = `900 ${fontSize}px system-ui, sans-serif`;
      }
      ctx.fillText(name, W / 2, 570);

      // Sub-line
      ctx.fillStyle = "#e9e9ef";
      ctx.font = "bold 38px system-ui, sans-serif";
      ctx.fillText("переміг у дуелі коміків", W / 2, 650);

      // Domain
      ctx.fillStyle = "#a6a6b3";
      ctx.font = "32px system-ui, sans-serif";
      ctx.fillText("standuphub.com.ua", W / 2, 760);

      // Accent bottom strip
      ctx.fillStyle = "#ff8a00";
      ctx.fillRect(0, H - 10, W, 10);

      return canvas;
    }

    shareBtn.addEventListener("click", async () => {
      const winner = winnerName.textContent;
      const url  = `https://standuphub.com.ua/funnier.html?winner=${encodeURIComponent(winner)}`;
      const text = `За моєю версією, найсмішніший комік — ${winner}! Перевір сам на StandupHub 👇`;
      const title = "Хто смішніший? • StandupHub";

      const canvas = buildShareImage(winner);

      // Try sharing with image file (mobile)
      if (navigator.share && navigator.canShare) {
        try {
          const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
          const file = new File([blob], "winner.png", { type: "image/png" });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ title, text, url, files: [file] });
            return;
          }
        } catch {}
      }

      // Fallback: share without image
      if (navigator.share) {
        navigator.share({ title, text, url }).catch(() => {});
        return;
      }

      // Desktop: copy link + offer image download
      navigator.clipboard.writeText(`${text}\n${url}`)
        .then(() => showToast("Посилання скопійовано!"))
        .catch(() => showToast("Не вдалось скопіювати"));

      // Also trigger image download on desktop
      canvas.toBlob(blob => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `winner-${winner}.png`;
        a.click();
        URL.revokeObjectURL(a.href);
      }, "image/png");
    });

    playAgainBtn.addEventListener("click", () => {
      history.replaceState({}, "", location.pathname);
      const names = window._gameNames;
      if (names) startGame(names);
    });

    // If opened via a shared link, show the winner directly
    const sharedWinner = new URLSearchParams(location.search).get("winner");

    // Load comedian names from rating.json
    fetch("data/rating.json", { cache: "no-cache" })
      .then(r => r.ok ? r.json() : [])
      .then(data => {
        const names = (data || []).map(r => r.performer).filter(Boolean);
        window._gameNames = names;
        
        // Don't preload photos - load them lazily as needed
        if (sharedWinner) {
          showWinner(sharedWinner, true);
        } else {
          startGame(names);
        }
      })
      .catch(() => {
        // Fallback: read names from already-rendered sidebar
        setTimeout(() => {
          const names = [...document.querySelectorAll(".sideName")]
            .map(el => el.textContent.trim())
            .filter(Boolean);
          window._gameNames = names;
          
          if (sharedWinner) {
            showWinner(sharedWinner, true);
          } else if (names.length >= 2) {
            startGame(names);
          }
        }, 500);
      });
  </script>
</body>
</html>
